<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I have a question for you... 🎬</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      position: relative;
    }

    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d) ease-in-out infinite alternate;
      opacity: 0;
    }
    @keyframes twinkle {
      0%   { opacity: 0.05; transform: scale(0.8); }
      100% { opacity: 0.6;  transform: scale(1.2); }
    }

    #app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      padding: 1.5rem;
      text-align: center;
    }

    .card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 3rem 2.5rem 2.5rem;
      backdrop-filter: blur(12px);
    }

    .emoji-display {
      font-size: 72px;
      line-height: 1;
      margin-bottom: 1.5rem;
      display: block;
    }
    .wiggle { animation: wiggle 0.45s ease forwards; }
    @keyframes wiggle {
      0%   { transform: rotate(0); }
      20%  { transform: rotate(-10deg) scale(1.15); }
      40%  { transform: rotate(10deg) scale(1.15); }
      60%  { transform: rotate(-6deg); }
      80%  { transform: rotate(6deg); }
      100% { transform: rotate(0); }
    }

    .headline {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      min-height: 68px;
      transition: opacity 0.2s;
    }

    .subtext {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      line-height: 1.65;
      margin-bottom: 2.5rem;
      min-height: 48px;
      transition: opacity 0.2s;
    }

    .btn-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .btn-yes {
      padding: 14px 40px;
      font-size: 16px;
      font-weight: 600;
      color: #0f0f0f;
      background: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn-yes:hover { transform: scale(1.05); box-shadow: 0 0 24px 4px rgba(255,255,255,0.2); }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 400;
      color: rgba(255,255,255,0.45);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      transform-origin: center;
      white-space: nowrap;
    }
    .btn-no:hover { background: rgba(255,255,255,0.06); }

    #thanks-screen { display: none; }
    .thanks-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 3.5rem 2.5rem 3.5rem;
      backdrop-filter: blur(12px);
      animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0%   { transform: scale(0.65); opacity: 0; }
      100% { transform: scale(1);    opacity: 1; }
    }

    .thanks-emoji {
      font-size: 68px;
      display: block;
      margin-bottom: 1.5rem;
      animation: floatUp 0.6s ease 0.3s both;
    }
    @keyframes floatUp {
      0%   { transform: translateY(12px); opacity: 0; }
      100% { transform: translateY(0);    opacity: 1; }
    }

    .thanks-main {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      margin-bottom: 1rem;
      animation: fadeUp 0.5s ease 0.5s both;
    }

    .thanks-note {
      font-size: 15px;
      color: rgba(255,255,255,0.5);
      line-height: 1.7;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.5s ease 0.65s both;
    }

    .dax-sig {
      display: inline-block;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.04em;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 1.25rem;
      width: 100%;
      animation: fadeUp 0.5s ease 0.8s both;
    }

    @keyframes fadeUp {
      0%   { transform: translateY(8px); opacity: 0; }
      100% { transform: translateY(0);   opacity: 1; }
    }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); border: 0;
    }
  </style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div id="app">
  <h2 class="sr-only">A movie date invitation</h2>

  <!-- INVITE SCREEN -->
  <div id="invite-screen">
    <div class="card">
      <span class="emoji-display" id="emojiDisplay">🎬</span>
      <div class="headline" id="headline">Hey, wanna go on a movie date with me?</div>
      <div class="subtext" id="subtext">Popcorn, good vibes, and great company. What do you say?</div>
      <div class="btn-row">
        <button class="btn-yes" onclick="sayYes()">Yes, I'm in! 🎉</button>
        <button class="btn-no" id="noBtn" onclick="sayNo()">No thanks</button>
      </div>
    </div>
  </div>

  <!-- THANKS SCREEN -->
  <div id="thanks-screen">
    <div class="thanks-card">
      <span class="thanks-emoji">🎉</span>
      <div class="thanks-main">You just made my day.</div>
      <div class="thanks-note">Seriously though — this means a lot. Get ready for the best movie night ever. See you soon!</div>
      <div class="dax-sig">— Dax 🎬</div>
    </div>
  </div>
</div>

<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%; left:${Math.random()*100}%;
      --d:${(Math.random()*3+1.5).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  const noMsgs = [
    { e:'🥺', h:"Wait… are you SURE?",           s:"I promise I'll share the popcorn. Every. Single. Piece." },
    { e:'😮', h:"That can't be right…",           s:"Maybe your finger slipped? Give it another try!" },
    { e:'🙈', h:"Okay okay… but hear me out.",    s:"You pick the movie. I'll buy the snacks. Deal?" },
    { e:'😅', h:"This button seems broken.",      s:"It keeps saying No when it clearly means Yes!" },
    { e:'🤔', h:"Are you SURE sure?",             s:"Because I've already reserved the best seats." },
    { e:'😂', h:"The No button is embarrassed.",  s:"Look how small it's getting. It knows the truth." },
    { e:'🎭', h:"Plot twist: you want to go.",    s:"Your heart knows. Just hit Yes already!" },
    { e:'🍿', h:"Think of the popcorn.",          s:"It's buttered. It's warm. It needs you." },
    { e:'😤', h:"LAST. CHANCE.",                  s:"The No button has filed a formal complaint." },
    { e:'🫶', h:"Come on… you know you want to.", s:"It'll be a great night. I promise on the popcorn." },
    { e:'✨', h:"The universe says YES.",          s:"Every star out there is rooting for you right now." },
    { e:'🎬', h:"Final scene. Your move.",        s:"The hero always says yes. Be the hero." },
  ];

  let noCount = 0;
  let noScale = 1.0;

  function sayNo() {
    const msg = noMsgs[Math.min(noCount, noMsgs.length - 1)];
    const emojiEl = document.getElementById('emojiDisplay');

    document.getElementById('headline').style.opacity = '0';
    document.getElementById('subtext').style.opacity  = '0';

    emojiEl.textContent = msg.e;
    emojiEl.classList.remove('wiggle');
    void emojiEl.offsetWidth;
    emojiEl.classList.add('wiggle');

    setTimeout(() => {
      document.getElementById('headline').textContent = msg.h;
      document.getElementById('subtext').textContent  = msg.s;
      document.getElementById('headline').style.opacity = '1';
      document.getElementById('subtext').style.opacity  = '1';
    }, 120);

    noScale = Math.max(0.35, noScale - 0.07);
    const noBtn = document.getElementById('noBtn');
    noBtn.style.transform = `scale(${noScale.toFixed(2)})`;
    noBtn.style.opacity   = Math.max(0.15, noScale - 0.1).toFixed(2);
    if (noScale <= 0.35) noBtn.style.pointerEvents = 'none';

    noCount++;
  }

  function sayYes() {
    document.getElementById('invite-screen').style.display = 'none';
    document.getElementById('thanks-screen').style.display = 'block';
  }
</script>
</body>
</html>
